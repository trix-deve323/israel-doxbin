<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>israel.doxbin.com</title>
<meta name="description" content="פלטפורמת תיעוד מאובטחת">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --bg1:#0a0a0a;
  --bg2:#101010;
  --bg3:#151515;
  --line:#1c1c1c;
  --line2:#252525;
  --line3:#303030;
  --txt:#c5c5c5;
  --txt2:#8a8a8a;
  --txt3:#5c5c5c;
  --bright:#ececec;
  --gold:#c9a227;
  --gold2:#e5c04a;
  --blue:#4a9eff;
  --red:#e5484d;
  --purple:#9d7ad1;
  --green:#4ea85a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:#000;
  color:var(--txt);
  font-family:'Heebo',Tahoma,Arial,sans-serif;
  font-size:13px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:embed;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#080808;}
::-webkit-scrollbar-thumb{background:#222;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#333;}

/* ====== HEADER ====== */
header{
  background:#000;
  border-bottom:1px solid #141414;
  position:sticky;top:0;
  z-index:100;
}
.header-inner{
  max-width:1160px;
  margin:0 auto;
  padding:0 18px;
  height:54px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{
  font-family:'JetBrains Mono','Heebo',monospace;
  font-size:17px;
  font-weight:700;
  color:#e8e8e8;
  cursor:pointer;
  white-space:nowrap;
  letter-spacing:-.3px;
}
.brand:hover{text-decoration:none;color:#fff;}
.brand .g{color:var(--gold);}

nav.main-nav{
  display:flex;
  gap:0;
  flex:1;
  align-items:center;
}
.nav-link{
  color:#8a8a8a;
  font-size:13px;
  font-weight:500;
  padding:8px 13px;
  cursor:pointer;
  background:none;
  border:none;
  font-family:inherit;
  white-space:nowrap;
  transition:color .12s;
}
.nav-link:hover{color:#e8e8e8;text-decoration:none;}
.nav-link.active{color:#fff;}

.nav-right{
  display:flex;align-items:center;gap:2px;
  margin-inline-start:auto;
}
.nav-right a,.nav-right button{
  color:#8a8a8a;
  font-size:13px;
  font-weight:500;
  padding:8px 12px;
  cursor:pointer;
  background:none;
  border:none;
  font-family:inherit;
  transition:color .12s;
}
.nav-right a:hover,.nav-right button:hover{color:#fff;text-decoration:none;}
.user-nav{
  display:flex;align-items:center;gap:7px;
  padding:3px 3px 3px 10px;
  border:1px solid #222;
  font-size:12px;
  color:#e8e8e8;
  cursor:pointer;
  transition:border-color .12s;
}
.user-nav:hover{border-color:#3a3a3a;}
.user-nav .ua{
  width:22px;height:22px;
  background:#2a2a2a;
  display:grid;place-items:center;
  color:#e8e8e8;font-weight:700;font-size:11px;
}

/* ====== CONTAINER ====== */
.container{max-width:1160px;margin:0 auto;padding:0 18px;}

/* ====== HERO ====== */
.hero{
  text-align:center;
  padding:44px 18px 22px;
}
.hero-logo{
  width:200px;height:200px;
  margin:0 auto 22px;
  display:block;
}
.hero-links{
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:center;
  margin-bottom:22px;
}
.hero-links a{
  color:var(--blue);
  font-size:14px;
  font-weight:500;
}
.hero-links a:hover{text-decoration:underline;}

.hero-label{
  color:#7a7a7a;
  font-size:12px;
  margin-bottom:9px;
}
.search-radio{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:10px;
  font-size:12px;
  color:#c5c5c5;
}
.search-radio label{
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.search-radio input[type=radio]{
  accent-color:#fff;
  cursor:pointer;
  width:13px;height:13px;
}
.search-row{
  display:flex;
  gap:5px;
  max-width:460px;
  margin:0 auto;
}
.search-row input{
  flex:1;
  background:#0d0d0d;
  border:1px solid #222;
  color:#fff;
  padding:8px 11px;
  font-family:inherit;
  font-size:13px;
  outline:none;
}
.search-row input:focus{border-color:#3a3a3a;}
.search-row input::placeholder{color:#555;}
.search-row button{
  background:#181818;
  border:1px solid #2a2a2a;
  color:#e8e8e8;
  padding:8px 18px;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  transition:background .12s;
}
.search-row button:hover{background:#222;}

.stats-line{
  color:#666;
  font-size:12px;
  margin:14px 0 10px;
}
.stats-line b{color:#bbb;font-weight:600;}

/* ====== PAGER ====== */
.pager{
  display:flex;
  justify-content:center;
  gap:3px;
  margin:10px 0 28px;
  flex-wrap:wrap;
}
.pager button{
  background:#0d0d0d;
  border:1px solid #222;
  color:#c5c5c5;
  padding:5px 10px;
  cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  min-width:30px;
  transition:all .12s;
}
.pager button:hover:not(:disabled){
  background:#191919;color:#fff;border-color:#333;
}
.pager button.active{
  background:#e8e8e8;
  color:#000;
  border-color:#e8e8e8;
  font-weight:700;
}
.pager button:disabled{opacity:.25;cursor:not-allowed;}

/* ====== SECTION ====== */
.section-head{
  color:#e8e8e8;
  font-size:14px;
  font-weight:600;
  margin:24px 0 8px;
}
.section-head .count{
  font-size:11px;
  color:#666;
  font-weight:400;
  margin-inline-start:4px;
}

/* ====== TABLE ====== */
.tbl{
  width:100%;
  border-collapse:collapse;
  margin-bottom:22px;
  font-size:13px;
}
.tbl thead th{
  background:#0a0a0a;
  color:#c5c5c5;
  text-align:start;
  padding:9px 12px;
  font-weight:600;
  font-size:12px;
  border-top:1px solid #1a1a1a;
  border-bottom:1px solid #1a1a1a;
  white-space:nowrap;
}
.tbl thead th.c{text-align:center;}
.tbl thead th.e{text-align:end;}
.tbl tbody tr{
  border-bottom:1px solid #0d0d0d;
  cursor:pointer;
  transition:background .1s;
}
.tbl tbody tr:nth-child(odd){background:#050505;}
.tbl tbody tr:hover{background:#111;}
.tbl td{padding:10px 12px;vertical-align:middle;}
.tbl td.title{
  color:var(--gold);
  font-weight:500;
  transition:color .1s;
}
.tbl tbody tr:hover td.title{color:var(--gold2);}
.tbl td.c{text-align:center;color:#c5c5c5;}
.tbl td.views{
  text-align:center;
  color:#c5c5c5;
  font-weight:500;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
}
.tbl td.author{text-align:end;font-size:12.5px;}
.tbl td.date{
  text-align:end;
  color:#7a7a7a;
  font-size:12px;
  white-space:nowrap;
}

.rk{font-weight:500;}
.rk-admin{color:var(--red);}
.rk-council{color:var(--blue);}
.rk-elite{color:var(--gold);}
.rk-rich{color:var(--purple);}
.rk-criminal{color:#e07a3d;}
.rk-user{color:#c5c5c5;}
.rk-tag{opacity:.85;font-weight:500;}

tr.pin-red{background:#1a0808!important;border-right:3px solid var(--red);}
tr.pin-red td.title{color:#ff8a8a!important;}
tr.pin-gold{background:#141005!important;border-right:3px solid var(--gold);}
tr.pin-blue{background:#061220!important;border-right:3px solid var(--blue);}
tr.pin-purple{background:#0e0818!important;border-right:3px solid var(--purple);}

/* ====== VIEW ====== */
.view-wrap{max-width:900px;margin:24px auto 60px;}
.view-head{
  padding:18px 0;
  border-bottom:1px solid #1a1a1a;
  margin-bottom:18px;
}
.view-title{
  font-size:20px;
  color:var(--gold);
  margin-bottom:10px;
  font-weight:600;
  line-height:1.3;
}
.view-meta{
  display:flex;gap:18px;flex-wrap:wrap;
  color:#7a7a7a;font-size:12px;align-items:center;
}
.view-meta b{color:#c5c5c5;font-weight:600;}
.view-actions{
  display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;
}
.view-actions button{
  background:#0d0d0d;
  border:1px solid #252525;
  color:#c5c5c5;
  padding:6px 13px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  transition:all .12s;
}
.view-actions button:hover{border-color:var(--gold);color:var(--gold);}
.view-actions button.danger:hover{border-color:var(--red);color:var(--red);}

.view-body{
  background:#050505;
  border:1px solid #141414;
  padding:18px 22px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  color:#c5c5c5;
  min-height:200px;
  direction:ltr;
  text-align:left;
}
.view-body img{max-width:100%;margin:8px 0;border:1px solid #1a1a1a;}

/* ====== PROFILE ====== */
.profile-banner{
  height:120px;
  background:#080808;
  border-bottom:1px solid #141414;
  position:relative;
  overflow:hidden;
}
.profile-banner::before{
  content:'';
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:36px 36px;
}
.profile-card{
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 22px 20px;
  max-width:1160px;
  margin:0 auto;
  margin-top:-52px;
  position:relative;
}
.profile-avatar{
  width:104px;height:104px;
  border-radius:4px;
  background:#1a1a1a;
  border:3px solid #000;
  display:grid;place-items:center;
  color:#e8e8e8;
  font-weight:700;
  font-size:38px;
  flex-shrink:0;
}
.profile-info{flex:1;padding-top:16px;}
.profile-name{
  font-size:22px;
  font-weight:700;
  color:#fff;
  margin-bottom:4px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.profile-name .rank-tag{
  font-size:12px;
  font-weight:500;
  opacity:.85;
}
.profile-bio{
  font-size:12.5px;
  color:#7a7a7a;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.profile-bio .sep{color:#2a2a2a;}
.profile-bio a{color:var(--gold);}
.profile-stats{
  display:flex;gap:18px;font-size:12px;color:#8a8a8a;
}
.profile-stats b{color:#e8e8e8;font-weight:600;font-family:'JetBrains Mono',monospace;}
.profile-actions{padding-top:22px;}
.btn-follow{
  background:#e8e8e8;
  color:#000;
  border:none;
  padding:7px 22px;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .12s;
}
.btn-follow:hover{background:#fff;}
.btn-follow.following{
  background:transparent;
  color:#c5c5c5;
  border:1px solid #333;
}
.btn-follow.following:hover{border-color:var(--red);color:var(--red);}

.profile-layout{
  max-width:1160px;
  margin:0 auto;
  padding:20px 22px 60px;
  display:grid;
  grid-template-columns:1fr 320px;
  gap:22px;
  align-items:start;
}

.info-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:22px;
  background:#050505;
  border:1px solid #141414;
  font-size:13px;
}
.info-table tr{border-bottom:1px solid #0f0f0f;}
.info-table tr:last-child{border-bottom:none;}
.info-table td{padding:10px 15px;vertical-align:middle;}
.info-table td:first-child{color:#7a7a7a;font-weight:500;}
.info-table td:last-child{
  color:#e8e8e8;
  font-weight:500;
  text-align:end;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
}

.panel{
  background:#050505;
  border:1px solid #141414;
}
.panel-head{
  padding:10px 15px;
  background:#0a0a0a;
  border-bottom:1px solid #141414;
  font-size:13px;
  font-weight:600;
  color:#e8e8e8;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.panel-head .count{
  color:#666;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:500;
}
.panel-body{
  padding:10px 15px;
  max-height:520px;
  overflow-y:auto;
}
.panel-body::-webkit-scrollbar{width:6px;}
.panel-body::-webkit-scrollbar-thumb{background:#222;}

.pcmt{
  padding:9px 0;
  border-bottom:1px solid #0d0d0d;
  font-size:12.5px;
  line-height:1.5;
}
.pcmt:last-child{border-bottom:none;}
.pcmt-head{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:3px;
  font-size:11.5px;
  flex-wrap:wrap;
}
.pcmt-head .author{font-weight:600;font-size:12px;}
.pcmt-head .sep{color:#2a2a2a;}
.pcmt-head .time{color:#666;font-family:'JetBrains Mono',monospace;font-size:11px;}
.pcmt-text{color:#b5b5b5;word-break:break-word;}
.pcmt-text a{color:var(--blue);}
.no-comments{
  padding:22px 15px;
  text-align:center;
  color:#555;
  font-size:12px;
}

/* ====== EDITOR ====== */
.editor{
  max-width:880px;
  margin:24px auto 60px;
  padding:0 18px;
}
.editor h2{
  color:#e8e8e8;
  font-size:18px;
  font-weight:600;
  margin-bottom:18px;
}
.editor textarea{
  width:100%;
  min-height:280px;
  background:#050505;
  border:1px solid #1a1a1a;
  color:#c5c5c5;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  padding:14px;
  resize:vertical;
  line-height:1.6;
  outline:none;
  direction:ltr;
  text-align:left;
}
.editor textarea:focus{border-color:#333;}
.editor input[type=text]{
  width:100%;
  background:#050505;
  border:1px solid #1a1a1a;
  color:#c5c5c5;
  padding:10px 13px;
  font-family:inherit;
  font-size:13px;
  margin-top:10px;
  outline:none;
}
.editor input[type=text]:focus{border-color:#333;}
.editor .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.editor .row input{flex:1;min-width:150px;margin-top:0;}
.editor-submit{
  background:var(--gold);
  color:#000;
  border:none;
  padding:10px 30px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:13.5px;
  margin-top:14px;
  transition:background .12s;
}
.editor-submit:hover{background:var(--gold2);}
.editor-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}
.editor-opts{
  margin-top:12px;
  display:flex;gap:18px;align-items:center;
  font-size:12px;color:#7a7a7a;flex-wrap:wrap;
}
.editor-opts select{
  background:#0d0d0d;
  border:1px solid #222;
  color:#c5c5c5;
  padding:6px 10px;
  font-family:inherit;
  font-size:12px;
  outline:none;
}
.editor-opts label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.editor-opts input[type=checkbox]{accent-color:var(--gold);cursor:pointer;}

.dropzone{
  border:2px dashed #222;
  padding:26px 20px;
  text-align:center;
  cursor:pointer;
  transition:all .12s;
  background:#050505;
  margin-bottom:12px;
}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:#0a0805;}
.dropzone-title{color:#e8e8e8;font-size:13px;font-weight:500;margin-bottom:4px;}
.dropzone-hint{color:#666;font-size:11.5px;}
.dropzone input{display:none;}

.img-preview{
  display:none;
  padding:12px;
  background:#050505;
  border:1px solid #1a1a1a;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.img-preview.show{display:flex;}
.img-preview img{max-width:100px;max-height:70px;border:1px solid #1a1a1a;}
.img-preview-info{flex:1;font-size:12px;}
.img-preview-name{color:#e8e8e8;font-weight:500;margin-bottom:2px;word-break:break-all;}
.img-preview-size{color:#666;font-family:'JetBrains Mono',monospace;font-size:11px;}
.img-preview-remove{
  background:transparent;border:1px solid #333;
  color:#c5c5c5;width:26px;height:26px;
  cursor:pointer;font-family:inherit;font-size:12px;
  transition:all .12s;
}
.img-preview-remove:hover{border-color:var(--red);color:var(--red);}

/* ====== COMMENTS (view) ====== */
.comments-section{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid #1a1a1a;
}
.comments-head{
  color:#e8e8e8;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}
.cmt{
  background:#0a0a0a;
  border:1px solid #141414;
  padding:9px 13px;
  margin-bottom:6px;
  font-size:12.5px;
}
.cmt-head{
  color:#7a7a7a;font-size:11px;margin-bottom:4px;
  display:flex;align-items:center;gap:8px;
}
.cmt-head b{color:var(--gold);font-size:12px;font-weight:600;}
.cmt-text{color:#b5b5b5;line-height:1.5;}
.cmt-input{display:flex;gap:5px;margin-top:12px;}
.cmt-input input{
  flex:1;
  background:#0d0d0d;
  border:1px solid #222;
  color:#fff;
  padding:9px 12px;
  font-family:inherit;
  font-size:13px;
  outline:none;
}
.cmt-input input:focus{border-color:var(--gold);}
.cmt-input button{
  background:var(--gold);
  color:#000;
  border:none;
  padding:9px 20px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:13px;
}
.cmt-input button:hover{background:var(--gold2);}

/* ====== CRUMB ====== */
.crumb{
  color:#666;font-size:12px;padding:16px 18px 0;
  max-width:1160px;margin:0 auto;
}
.crumb a{color:var(--blue);}
.crumb .sep{color:#2a2a2a;margin:0 6px;}

.empty{text-align:center;color:#666;padding:60px 20px;font-size:13px;}

/* ====== MODAL ====== */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  z-index:1000;align-items:center;justify-content:center;
  padding:16px;
}
.modal-bg.open{display:flex;}
.modal{
  background:#0a0a0a;
  border:1px solid #222;
  width:340px;max-width:100%;
  padding:24px;
}
.modal h2{
  color:#e8e8e8;font-size:16px;margin-bottom:14px;font-weight:600;
}
.modal input{
  width:100%;
  background:#050505;
  border:1px solid #1a1a1a;
  color:#c5c5c5;
  padding:10px 12px;
  margin-bottom:9px;
  font-family:inherit;
  font-size:13px;
  outline:none;
}
.modal input:focus{border-color:var(--gold);}
.modal-btn{
  width:100%;
  background:var(--gold);
  color:#000;
  border:none;
  padding:11px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:13.5px;
}
.modal-btn:hover{background:var(--gold2);}
.modal-swap{
  color:#666;font-size:12px;margin-top:10px;
  text-align:center;cursor:pointer;
}
.modal-swap:hover{color:var(--gold);}
.modal-err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px;}

footer{
  text-align:center;
  color:#3a3a3a;
  font-size:11px;
  padding:30px 18px;
  border-top:1px solid #111;

function renderPager(total){
  if(total<=1) return '';
  const pages = [];
  if(total<=7){ for(let i=1;i<=total;i++) pages.push(i); }
  else if(page<=4) pages.push(1,2,3,4,5,'…',total);
  else if(page>=total-3) pages.push(1,'…',total-4,total-3,total-2,total-1,total);
  else pages.push(1,'…',page-1,page,page+1,'…',total);
  return `<div class="pager">
    <button onclick="setPage(1)" ${page===1?'disabled':''}>«</button>
    ${pages.map(p=> p==='…' ? '<button disabled>…</button>' : `<button class="${p===page?'active':''}" onclick="setPage(${p})">${p}</button>`).join('')}
    <button onclick="setPage(${total})" ${page===total?'disabled':''}>»</button>
  </div>`;
}

  const rowsHtml = userPastes.length ? userPastes.map(p=>`
    <tr onclick="openPaste('${p.id}')">
      <td class="title">${esc(p.title)}</td>
      <td class="c">${(p.comments||[]).length}</td>
      <td class="views">${fmtNum(p.views)}</td>
      <td class="date">${esc(p.date)}</td>
    </tr>`).join('') : `<tr><td colspan="4" style="text-align:center;color:#555;padding:22px;">אין תיעודים</td></tr>`;

  const cmtsHtml = pcmts.length ? pcmts.map(c=>`
    <div class="pcmt">
      <div class="pcmt-head">
        <span class="author rk rk-${c.rank||'user'}">${esc(c.author)}${rankLabel(c.rank)?` <span class="rk-tag">[${rankLabel(c.rank)}]</span>`:''}</span>
        <span class="sep">—</span>
        <span class="time">${timeAgo(c.ts)}</span>
      </div>
      <div class="pcmt-text">${esc(c.text)}</div>
    </div>`).join('') : `<div class="no-comments">אין תגובות</div>`;

  return `
    <div class="profile-banner"></div>
    <div class="profile-card">
      <div class="profile-avatar">${esc(name.charAt(0).toUpperCase())}</div>
      <div class="profile-info">
        <div class="profile-name">
          <span class="rk rk-${u.rank}">${esc(name)}</span>
          ${rankLabel(u.rank)?`<span class="rank-tag rk rk-${u.rank}">[${rankLabel(u.rank)}]</span>`:''}
        </div>
        <div class="profile-bio">
          <span>0$</span>
          <span class="sep">·</span>
          <a href="https://discord.gg/guardians-of-israel" target="_blank" rel="noopener">הצטרף לדיסקורד</a>
          <span class="sep">·</span>
          <span>אנחנו עוקבים אחרי החברים שלנו</span>
        </div>
        <div class="profile-stats">
          <span><b>${u.following||0}</b> עוקב</span>
          <span><b>${u.followers||0}</b> עוקבים</span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="btn-follow ${isFollowing?'following':''}" onclick="toggleFollow('${esc(name)}')">
          ${isFollowing?'עוקב':'עקוב'}
        </button>
      </div>
    </div>

    <div class="profile-layout">
      <div>
        <table class="info-table">
          <tr><td>מזהה</td><td>${u.id||'—'}</td></tr>
          <tr><td>הצטרף</td><td>${u.joined||'—'}</td></tr>
          <tr><td>תיעודים</td><td>${userPastes.length}</td></tr>
          <tr><td>עוקבים</td><td>${u.followers||0}</td></tr>
        </table>

        <table class="tbl">
          <thead><tr>
            <th>כותרת</th>
            <th class="c">תגובות</th>
            <th class="c">צפיות</th>
            <th class="e">תאריך</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>

      <div>
        <div class="panel">
          <div class="panel-head">תגובות פרופיל <span class="count">(${pcmts.length})</span></div>
          <div class="panel-body">${cmtsHtml}</div>
        </div>
      </div>
    </div>
  `;
}

function toggleFollow(name){
  if(!user){ toast('יש להתחבר כדי לעקוב'); return; }
  if(!users[user]) users[user] = {name:user, rank:'user', followingSet:[], following:0, followers:0, joined:'', id:Math.floor(Math.random()*999999)};
  if(!users[user].followingSet) users[user].followingSet = [];
  if(!users[name]) users[name] = {name, rank:'user', following:0, followers:0, joined:'', id:Math.floor(Math.random()*999999)};
  const set = users[user].followingSet;
  const idx = set.indexOf(name);
  if(idx === -1){
    set.push(name);
    users[name].followers = (users[name].followers||0)+1;
    users[user].following = (users[user].following||0)+1;
    toast('התחלת לעקוב אחרי '+name);
  } else {
    set.splice(idx,1);
    users[name].followers = Math.max(0,(users[name].followers||0)-1);
    users[user].following = Math.max(0,(users[user].following||0)-1);
    toast('הפסקת לעקוב אחרי '+name);
  }
  saveUsers(); render();
}

function renderTrending(){
  const sorted = [...pastes].sort((a,b)=>b.views-a.views).slice(0,50);
  const rows = sorted.map((p,i)=>`
    <tr onclick="openPaste('${p.id}')">
      <td class="c" style="color:var(--gold);font-weight:600;font-family:'JetBrains Mono',monospace;">${i+1}</td>
      <td class="title">${esc(p.title)}</td>
      <td class="c">${(p.comments||[]).length}</td>
      <td class="views">${fmtNum(p.views)}</td>
      <td class="author">${authorHtml(p)}</td>
      <td class="date">${esc(p.date)}</td>
    </tr>`).join('');
  return `
    <div class="crumb"><a onclick="goFeed()">בית</a><span class="sep">/</span><span>מובילים</span></div>
    <div class="container">
      <div class="section-head" style="margin-top:22px;">התיעודים הנצפים ביותר <span class="count">(50)</span></div>
      <table class="tbl">
        <thead><tr>
          <th class="c" style="width:44px;">#</th>
          <th>כותרת</th><th class="c">תגובות</th><th class="c">צפיות</th>
          <th class="e">מחבר</th><th class="e">תאריך</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderUsers(){
  const list = Object.values(users).map(u=>{
    const up = pastes.filter(p=>p.author===u.name);
    const views = up.reduce((s,p)=>s+(p.views||0),0);
    const cmts = up.reduce((s,p)=>s+((p.comments||[]).length),0);
    return {...u, count:up.length, views, cmts};
  }).sort((a,b)=>b.views-a.views);
  const rows = list.map((u,i)=>`
    <tr onclick="goProfile('${esc(u.name)}')">
      <td class="c" style="color:var(--gold);font-weight:600;font-family:'JetBrains Mono',monospace;">${i+1}</td>
      <td class="title">${authorHtml({author:u.name, rank:u.rank})}</td>
      <td class="c">${u.count}</td>
      <td class="views">${fmtNum(u.views)}</td>
      <td class="c">${u.cmts}</td>
      <td class="c">${u.followers||0}</td>
    </tr>`).join('');
  return `
    <div class="crumb"><a onclick="goFeed()">בית</a><span class="sep">/</span><span>משתמשים</span></div>
    <div class="container">
      <div class="section-head" style="margin-top:22px;">כל המשתמשים <span class="count">(${list.length})</span></div>
      <table class="tbl">
        <thead><tr>
          <th class="c" style="width:44px;">#</th>
          <th>שם משתמש</th>
          <th class="c">תיעודים</th>
          <th class="c">צפיות</th>
          <th class="c">תגובות</th>
          <th class="c">עוקבים</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderRules(){
  const rules = [
    {t:'סוג תוכן', d:'ניתן לפרסם טקסטים, קישורים ותמונות בלבד.'},
    {t:'פרטיות', d:'אין לפרסם מידע אישי מזהה על אנשים ללא הסכמתם.'},
    {t:'תוכן אסור', d:'אין לפרסם תוכן פוגעני, מאיים או מסית.'},
    {t:'שפה', d:'יש לשמור על שפה מכבדת בכל אינטראקציה.'},
    {t:'דיווח', d:'יש לדווח על תוכן בעייתי להנהלה.'},
    {t:'אחריות', d:'האחריות על תוכן חלה על המפרסם בלבד.'}
  ];
  return `
    <div class="crumb"><a onclick="goFeed()">בית</a><span class="sep">/</span><span>תקנון</span></div>
    <div class="container" style="max-width:780px;">
      <h1 style="color:#e8e8e8;font-size:20px;font-weight:600;margin:28px 0 6px;">תקנון השימוש</h1>
      <p style="color:#666;font-size:12.5px;margin-bottom:24px;">כללי השימוש בפלטפורמת israel.doxbin.com</p>
      ${rules.map((r,i)=>`
        <div style="background:#050505;border:1px solid #141414;padding:13px 17px;margin-bottom:7px;border-right:3px solid var(--gold);">
          <div style="color:#e8e8e8;font-weight:600;font-size:13px;margin-bottom:3px;">${String(i+1).padStart(2,'0')} — ${r.t}</div>
          <div style="color:#999;font-size:12.5px;line-height:1.6;">${r.d}</div>
        </div>
      `).join('')}
    </div>

function renderEditor(){
  return `
    <div class="crumb"><a onclick="goFeed()">בית</a><span class="sep">/</span><span>הוספת תיעוד</span></div>
    <div class="editor">
      <h2>הוספת תיעוד חדש</h2>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-title">גרור תמונה לכאן או לחץ לבחירה</div>
        <div class="dropzone-hint">תמונות בלבד — עד 5MB</div>
        <input type="file" id="fileInput" accept="image/*" onchange="onFileSelect(event)">
      </div>

      <div class="img-preview" id="imgPreview">
        <img id="imgPreviewImg" alt="">
        <div class="img-preview-info">
          <div class="img-preview-name" id="imgPreviewName"></div>
          <div class="img-preview-size" id="imgPreviewSize"></div>
        </div>
        <button class="img-preview-remove" onclick="removeImage()">✕</button>
      </div>

      <textarea id="edContent" placeholder="הקלד את התוכן כאן..."></textarea>
      <input type="text" id="edTitle" placeholder="כותרת (חובה)">
      <div class="row">
        <input type="text" id="edTags" placeholder="תגיות (מופרדות בפסיק)">
      </div>

      <div class="editor-opts">
        <label>סוג תוכן:
          <select id="edLang">
            <option value="טקסט">טקסט</option>
            <option value="קוד">קוד</option>
            <option value="קישור">קישור</option>
            <option value="מסמך">מסמך</option>
          </select>
        </label>
        <label><input type="checkbox" id="edAnon"> פרסום אנונימי</label>
      </div>

      <button class="editor-submit" onclick="submitPaste()">פרסום תיעוד</button>
      <div class="editor-err" id="edErr"></div>
    </div>
  `;
}

let uploadedImage = null;

function onFileSelect(e){
  const f = e.target.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('ניתן להעלות תמונות בלבד'); return; }
  if(f.size > 5*1024*1024){ toast('הקובץ גדול מדי'); return; }
  const r = new FileReader();
  r.onload = ev=>{
    uploadedImage = { data:ev.target.result, name:f.name, size:f.size };
    document.getElementById('imgPreviewImg').src = ev.target.result;
    document.getElementById('imgPreviewName').textContent = f.name;
    document.getElementById('imgPreviewSize').textContent = (f.size/1024).toFixed(1)+' KB';
    document.getElementById('imgPreview').classList.add('show');
  };
  r.readAsDataURL(f);
}
function removeImage(){
  uploadedImage = null;
  const fi = document.getElementById('fileInput');
  if(fi) fi.value = '';
  const pv = document.getElementById('imgPreview');
  if(pv) pv.classList.remove('show');
}

function setupDropzone(){
  const dz = document.getElementById('dropzone');
  if(!dz || dz._setup) return;
  dz._setup = true;
  ['dragenter','dragover'].forEach(ev=>{
    dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(ev=>{
    dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if(!f) return;
    if(!f.type.startsWith('image/')){ toast('ניתן להעלות תמונות בלבד'); return; }
    if(f.size > 5*1024*1024){ toast('הקובץ גדול מדי'); return; }
    const r = new FileReader();
    r.onload = ev=>{
      uploadedImage = { data:ev.target.result, name:f.name, size:f.size };
      document.getElementById('imgPreviewImg').src = ev.target.result;
      document.getElementById('imgPreviewName').textContent = f.name;
      document.getElementById('imgPreviewSize').textContent = (f.size/1024).toFixed(1)+' KB';
      document.getElementById('imgPreview').classList.add('show');
    };
    r.readAsDataURL(f);
  });
}

function submitPaste(){
  const content = document.getElementById('edContent').value.trim();
  const title = document.getElementById('edTitle').value.trim();
  const tagsRaw = document.getElementById('edTags').value.trim();
  const lang = document.getElementById('edLang').value;
  const anon = document.getElementById('edAnon').checked;
  const err = document.getElementById('edErr');

  if(!content && !uploadedImage){ err.textContent = 'יש להזין תוכן או תמונה'; return; }
  if(!title){ err.textContent = 'כותרת היא שדה חובה'; return; }
  err.textContent = '';

  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);
  const author = anon ? 'אנונימי' : (user || 'אורח');

  if(!anon && user && !users[user]){
    users[user] = {name:user, rank:'user', joined:'ספטמבר 2026', following:0, followers:0, id:Math.floor(Math.random()*999999), followingSet:[]};
    saveUsers();
  }

  const p = {
    id: uid(), title, author,
    rank: anon ? 'user' : (users[author]?.rank || 'user'),
    content: content || '', image: uploadedImage, tags, lang,
    views: 0, ts: Date.now(),
    date: new Date().toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}),
    comments: []
  };
  pastes.unshift(p);
  save();
  uploadedImage = null;
  toast('התיעוד פורסם בהצלחה');
  openPaste(p.id);
}

function copyPaste(){
  const p = pastes.find(x=>x.id===viewId);
  if(!p) return;
  const text = p.content + (p.image ? '\n\n[תמונה: '+p.image.name+']' : '');
  navigator.clipboard.writeText(text).then(()=>{
    const b = document.getElementById('copyBtn');
    if(b){ b.textContent='הועתק'; setTimeout(()=>b.textContent='העתקת תוכן',1400); }
    toast('התוכן הועתק');
  }).catch(()=>toast('ההעתקה נכשלה'));
}
function sharePaste(){
  const url = 'https://israel.doxbin.com/#t-' + viewId;
  navigator.clipboard.writeText(url).then(()=>toast('הקישור הועתק')).catch(()=>toast(url));
}
function deletePaste(id){
  if(!confirm('למחוק את התיעוד?')) return;
  pastes = pastes.filter(p=>p.id!==id);
  save(); goFeed(); toast('התיעוד נמחק');
}
function addComment(id){
  const p = pastes.find(x=>x.id===id);
  if(!p) return;
  const inp = document.getElementById('cmtInput');
  const text = inp.value.trim();
  if(!text) return;
  p.comments = p.comments || [];
  p.comments.push({
    author: user || 'אורח', text,
    date: new Date().toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
  });
  save(); render(); toast('התגובה פורסמה');
}

function openModal(id){ closeModals(); document.getElementById('m-'+id).classList.add('open'); }
function closeModals(){ document.querySelectorAll('.modal-bg').forEach(m=>m.classList.remove('open')); }
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModals(); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModals(); });

function doLogin(){
  const n = document.getElementById('lg-name').value.trim();
  const pw = document.getElementById('lg-pass').value.trim();
  const e = document.getElementById('lg-err');
  if(!n || !pw){ e.textContent = 'נא למלא שם משתמש וסיסמה'; return; }
  if(!users[n]){
    users[n] = {name:n, rank:'user', joined:'ספטמבר 2026', following:0, followers:0, id:Math.floor(Math.random()*999999), followingSet:[]};
    saveUsers();
  }
  setUser(n); closeModals(); toast('התחברת בהצלחה');
}
function doSignup(){
  const n = document.getElementById('su-name').value.trim();
  const em = document.getElementById('su-email').value.trim();
  const pw = document.getElementById('su-pass').value.trim();
  const e = document.getElementById('su-err');
  if(!n || !pw){ e.textContent = 'נא למלא שם משתמש וסיסמה'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ e.textContent = 'אימייל לא תקין'; return; }
  if(!users[n]){
    users[n] = {name:n, rank:'user', joined:'ספטמבר 2026', following:0, followers:0, id:Math.floor(Math.random()*999999), followingSet:[]};
    saveUsers();
  }
  setUser(n); closeModals(); toast('נרשמת בהצלחה');
}
function setUser(n){
  user = n;
  localStorage.setItem(LS.USER, n);
  if(!users[n]){
    users[n] = {name:n, rank:'user', joined:'ספטמבר 2026', following:0, followers:0, id:Math.floor(Math.random()*999999), followingSet:[]};
    saveUsers();
  }
  updateAuth();
}
function logout(){
  user = null;
  localStorage.removeItem(LS.USER);
  updateAuth(); toast('התנתקת');
}
function updateAuth(){
  const a = document.getElementById('navAuth');
  const b = document.getElementById('userBox');
  if(!a || !b) return;
  if(user){
    a.style.display = 'none';
    b.style.display = 'inline-flex';
    b.style.alignItems = 'center';
    b.style.gap = '2px';
    document.getElementById('userNameNav').textContent = user;
    document.getElementById('userAvatarNav').textContent = user.charAt(0).toUpperCase();
  } else {
    a.style.display = 'inline';
    b.style.display = 'none';
  }
}

render();
saveUsers();
</script>
</body>
</html>
