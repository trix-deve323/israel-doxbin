<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>israel.doxbin.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg1:#0a0a0a;--bg2:#101010;--bg3:#151515;--line:#1c1c1c;--line2:#252525;--txt:#c5c5c5;--txt2:#8a8a8a;--bright:#ececec;--gold:#c9a227;--gold2:#e5c04a;--blue:#4a9eff;--red:#e5484d;--purple:#9d7ad1;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:var(--txt);font-family:'Heebo',sans-serif;font-size:13px;line-height:1.5;min-height:100vh;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#080808;}
::-webkit-scrollbar-thumb{background:#222;}
header{background:#000;border-bottom:1px solid #141414;position:sticky;top:0;z-index:100;}
.header-inner{max-width:1160px;margin:0 auto;padding:0 18px;height:54px;display:flex;align-items:center;gap:22px;}
.brand{font-family:'JetBrains Mono','Heebo',monospace;font-size:17px;font-weight:700;color:#e8e8e8;cursor:pointer;white-space:nowrap;letter-spacing:-.3px;}
.brand .g{color:var(--gold);}
nav.main-nav{display:flex;gap:0;flex:1;}
.nav-link{color:#8a8a8a;font-size:13px;font-weight:500;padding:8px 13px;cursor:pointer;background:none;border:none;font-family:inherit;white-space:nowrap;transition:color .12s;}
.nav-link:hover{color:#e8e8e8;}
.nav-link.active{color:#fff;}
.nav-right{display:flex;align-items:center;gap:2px;margin-inline-start:auto;}
.nav-right a,.nav-right button{color:#8a8a8a;font-size:13px;font-weight:500;padding:8px 12px;cursor:pointer;background:none;border:none;font-family:inherit;transition:color .12s;}
.nav-right a:hover,.nav-right button:hover{color:#fff;}
.user-nav{display:flex;align-items:center;gap:7px;padding:3px 3px 3px 10px;border:1px solid #222;font-size:12px;color:#e8e8e8;cursor:pointer;}
.user-nav .ua{width:22px;height:22px;background:#2a2a2a;display:grid;place-items:center;color:#e8e8e8;font-weight:700;font-size:11px;}
.container{max-width:1160px;margin:0 auto;padding:0 18px;}
.hero{text-align:center;padding:44px 18px 22px;}
.hero-logo{width:200px;height:200px;margin:0 auto 22px;display:block;}
.hero-links{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:22px;}
.hero-links a{color:var(--blue);font-size:14px;font-weight:500;}
.hero-label{color:#7a7a7a;font-size:12px;margin-bottom:9px;}
.search-radio{display:flex;justify-content:center;gap:18px;margin-bottom:10px;font-size:12px;color:#c5c5c5;}
.search-radio label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.search-radio input[type=radio]{accent-color:#fff;cursor:pointer;}
.search-row{display:flex;gap:5px;max-width:460px;margin:0 auto;}
.search-row input{flex:1;background:#0d0d0d;border:1px solid #222;color:#fff;padding:8px 11px;font-family:inherit;font-size:13px;outline:none;}
.search-row input:focus{border-color:#3a3a3a;}
.search-row input::placeholder{color:#555;}
.search-row button{background:#181818;border:1px solid #2a2a2a;color:#e8e8e8;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:13px;}
.search-row button:hover{background:#222;}
.stats-line{color:#666;font-size:12px;margin:14px 0 10px;}
.stats-line b{color:#bbb;font-weight:600;}
.pager{display:flex;justify-content:center;gap:3px;margin:10px 0 28px;flex-wrap:wrap;}
.pager button{background:#0d0d0d;border:1px solid #222;color:#c5c5c5;padding:5px 10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;min-width:30px;}
.pager button:hover:not(:disabled){background:#191919;color:#fff;border-color:#333;}
.pager button.active{background:#e8e8e8;color:#000;border-color:#e8e8e8;font-weight:700;}
.pager button:disabled{opacity:.25;cursor:not-allowed;}
.section-head{color:#e8e8e8;font-size:14px;font-weight:600;margin:24px 0 8px;}
.section-head .count{font-size:11px;color:#666;font-weight:400;margin-inline-start:4px;}
.tbl{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13px;}
.tbl thead th{background:#0a0a0a;color:#c5c5c5;text-align:start;padding:9px 12px;font-weight:600;font-size:12px;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;white-space:nowrap;}
.tbl thead th.c{text-align:center;}
.tbl thead th.e{text-align:end;}
.tbl tbody tr{border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background .1s;}
.tbl tbody tr:nth-child(odd){background:#050505;}
.tbl tbody tr:hover{background:#111;}
.tbl td{padding:10px 12px;vertical-align:middle;}
.tbl td.title{color:var(--gold);font-weight:500;}
.tbl tbody tr:hover td.title{color:var(--gold2);}
.tbl td.c{text-align:center;color:#c5c5c5;}
.tbl td.views{text-align:center;color:#c5c5c5;font-weight:500;font-family:'JetBrains Mono',monospace;font-size:12px;}
.tbl td.author{text-align:end;font-size:12.5px;}
.tbl td.date{text-align:end;color:#7a7a7a;font-size:12px;white-space:nowrap;}
.rk{font-weight:500;}
.rk-admin{color:var(--red);}
.rk-council{color:var(--blue);}
.rk-elite{color:var(--gold);}
.rk-rich{color:var(--purple);}
.rk-criminal{color:#e07a3d;}
.rk-user{color:#c5c5c5;}
.rk-tag{opacity:.85;font-weight:500;}
tr.pin-red{background:#1a0808!important;border-right:3px solid var(--red);}
tr.pin-red td.title{color:#ff8a8a!important;}
tr.pin-gold{background:#141005!important;border-right:3px solid var(--gold);}
tr.pin-blue{background:#061220!important;border-right:3px solid var(--blue);}
tr.pin-purple{background:#0e0818!important;border-right:3px solid var(--purple);}
.view-wrap{max-width:900px;margin:24px auto 60px;}
.view-head{padding:18px 0;border-bottom:1px solid #1a1a1a;margin-bottom:18px;}
.view-title{font-size:20px;color:var(--gold);margin-bottom:10px;font-weight:600;}
.view-meta{display:flex;gap:18px;flex-wrap:wrap;color:#7a7a7a;font-size:12px;align-items:center;}
.view-meta b{color:#c5c5c5;font-weight:600;}
.view-actions{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;}
.view-actions button{background:#0d0d0d;border:1px solid #252525;color:#c5c5c5;padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12px;}
.view-actions button:hover{border-color:var(--gold);color:var(--gold);}
.view-actions button.danger:hover{border-color:var(--red);color:var(--red);}
.view-body{background:#050505;border:1px solid #141414;padding:18px 22px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#c5c5c5;min-height:200px;direction:ltr;text-align:left;}
.view-body img{max-width:100%;margin:8px 0;border:1px solid #1a1a1a;}
.profile-banner{height:120px;background:#080808;border-bottom:1px solid #141414;position:relative;overflow:hidden;}
.profile-banner::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:36px 36px;}
.profile-card{display:flex;align-items:center;gap:18px;padding:0 22px 20px;max-width:1160px;margin:0 auto;margin-top:-52px;position:relative;}
.profile-avatar{width:104px;height:104px;background:#1a1a1a;border:3px solid #000;display:grid;place-items:center;color:#e8e8e8;font-weight:700;font-size:38px;flex-shrink:0;}
.profile-info{flex:1;padding-top:16px;}
.profile-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.profile-bio{font-size:12.5px;color:#7a7a7a;margin-bottom:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.profile-bio a{color:var(--gold);}
.profile-stats{display:flex;gap:18px;font-size:12px;color:#8a8a8a;}
.profile-stats b{color:#e8e8e8;font-weight:600;font-family:'JetBrains Mono',monospace;}
.profile-actions{padding-top:22px;}
.btn-follow{background:#e8e8e8;color:#000;border:none;padding:7px 22px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.btn-follow.following{background:transparent;color:#c5c5c5;border:1px solid #333;}
.btn-follow.following:hover{border-color:var(--red);color:var(--red);}
.profile-layout{max-width:1160px;margin:0 auto;padding:20px 22px 60px;display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start;}
.info-table{width:100%;border-collapse:collapse;margin-bottom:22px;background:#050505;border:1px solid #141414;font-size:13px;}
.info-table tr{border-bottom:1px solid #0f0f0f;}
.info-table tr:last-child{border-bottom:none;}
.info-table td{padding:10px 15px;}
.info-table td:first-child{color:#7a7a7a;}
.info-table td:last-child{color:#e8e8e8;text-align:end;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
.panel{background:#050505;border:1px solid #141414;}
.panel-head{padding:10px 15px;background:#0a0a0a;border-bottom:1px solid #141414;font-size:13px;font-weight:600;color:#e8e8e8;display:flex;justify-content:space-between;}
.panel-head .count{color:#666;font-family:'JetBrains Mono',monospace;font-size:11px;}
.panel-body{padding:10px 15px;max-height:520px;overflow-y:auto;}
.pcmt{padding:9px 0;border-bottom:1px solid #0d0d0d;font-size:12.5px;}
.pcmt:last-child{border-bottom:none;}
.pcmt-head{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11.5px;flex-wrap:wrap;}
.pcmt-head .author{font-weight:600;font-size:12px;}
.pcmt-head .sep{color:#2a2a2a;}
.pcmt-head .time{color:#666;font-family:'JetBrains Mono',monospace;font-size:11px;}
.pcmt-text{color:#b5b5b5;word-break:break-word;}
.no-comments{padding:22px 15px;text-align:center;color:#555;font-size:12px;}
.editor{max-width:880px;margin:24px auto 60px;padding:0 18px;}
.editor h2{color:#e8e8e8;font-size:18px;font-weight:600;margin-bottom:18px;}
.editor textarea{width:100%;min-height:280px;background:#050505;border:1px solid #1a1a1a;color:#c5c5c5;font-family:'JetBrains Mono',monospace;font-size:13px;padding:14px;resize:vertical;line-height:1.6;outline:none;direction:ltr;text-align:left;}
.editor input[type=text]{width:100%;background:#050505;border:1px solid #1a1a1a;color:#c5c5c5;padding:10px 13px;font-family:inherit;font-size:13px;margin-top:10px;outline:none;}
.editor .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.editor .row input{flex:1;min-width:150px;margin-top:0;}
.editor-submit{background:var(--gold);color:#000;border:none;padding:10px 30px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13.5px;margin-top:14px;}
.editor-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}
.editor-opts{margin-top:12px;display:flex;gap:18px;align-items:center;font-size:12px;color:#7a7a7a;flex-wrap:wrap;}
.editor-opts select{background:#0d0d0d;border:1px solid #222;color:#c5c5c5;padding:6px 10px;font-family:inherit;font-size:12px;}
.editor-opts label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.dropzone{border:2px dashed #222;padding:26px 20px;text-align:center;cursor:pointer;background:#050505;margin-bottom:12px;}
.dropzone:hover{border-color:var(--gold);}
.dropzone-title{color:#e8e8e8;font-size:13px;font-weight:500;margin-bottom:4px;}
.dropzone-hint{color:#666;font-size:11.5px;}
.dropzone input{display:none;}
.img-preview{display:none;padding:12px;background:#050505;border:1px solid #1a1a1a;align-items:center;gap:12px;margin-bottom:12px;}
.img-preview.show{display:flex;}
.img-preview img{max-width:100px;max-height:70px;border:1px solid #1a1a1a;}
.img-preview-info{flex:1;font-size:12px;}
.img-preview-name{color:#e8e8e8;font-weight:500;margin-bottom:2px;word-break:break-all;}
.img-preview-size{color:#666;font-family:'JetBrains Mono',monospace;font-size:11px;}
.img-preview-remove{background:transparent;border:1px solid #333;color:#c5c5c5;width:26px;height:26px;cursor:pointer;font-family:inherit;}
.comments-section{margin-top:30px;padding-top:18px;border-top:1px solid #1a1a1a;}
.comments-head{color:#e8e8e8;font-size:13px;font-weight:600;margin-bottom:12px;}
.cmt{background:#0a0a0a;border:1px solid #141414;padding:9px 13px;margin-bottom:6px;font-size:12.5px;}
.cmt-head{color:#7a7a7a;font-size:11px;margin-bottom:4px;display:flex;gap:8px;}
.cmt-head b{color:var(--gold);font-size:12px;font-weight:600;}
.cmt-text{color:#b5b5b5;}
.cmt-input{display:flex;gap:5px;margin-top:12px;}
.cmt-input input{flex:1;background:#0d0d0d;border:1px solid #222;color:#fff;padding:9px 12px;font-family:inherit;font-size:13px;outline:none;}
.cmt-input button{background:var(--gold);color:#000;border:none;padding:9px 20px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;}
.crumb{color:#666;font-size:12px;padding:16px 18px 0;max-width:1160px;margin:0 auto;}
.crumb a{color:var(--blue);}
.crumb .sep{color:#2a2a2a;margin:0 6px;}
.empty{text-align:center;color:#666;padding:60px 20px;font-size:13px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:#0a0a0a;border:1px solid #222;width:340px;max-width:100%;padding:24px;}
.modal h2{color:#e8e8e8;font-size:16px;margin-bottom:14px;font-weight:600;}
.modal input{width:100%;background:#050505;border:1px solid #1a1a1a;color:#c5c5c5;padding:10px 12px;margin-bottom:9px;font-family:inherit;font-size:13px;outline:none;}
.modal input:focus{border-color:var(--gold);}
.modal-btn{width:100%;background:var(--gold);color:#000;border:none;padding:11px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13.5px;}
.modal-swap{color:#666;font-size:12px;margin-top:10px;text-align:center;cursor:pointer;}
.modal-swap:hover{color:var(--gold);}
.modal-err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px;}
footer{text-align:center;color:#3a3a3a;font-size:11px;padding:30px 18px;border-top:1px solid #111;margin-top:40px;font-family:'JetBrains Mono',monospace;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#e8e8e8;color:#000;padding:11px 22px;font-size:13px;font-weight:600;transition:all .25s;opacity:0;z-index:2000;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media (max-width:900px){.header-inner{padding:0 12px;gap:10px;height:auto;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;}nav.main-nav{order:3;width:100%;overflow-x:auto;}.container{padding:0 12px;}.profile-layout{grid-template-columns:1fr;padding:16px 12px 40px;}.profile-card{flex-direction:column;text-align:center;padding:0 12px 20px;gap:12px;}.profile-info{padding-top:0;}.profile-name,.profile-bio,.profile-stats{justify-content:center;}.profile-actions{padding-top:0;}.profile-avatar{width:80px;height:80px;font-size:30px;}.tbl thead th:nth-child(2),.tbl td:nth-child(2){display:none;}.tbl td.date,.tbl thead th:last-child{display:none;}.hero-logo{width:150px;height:150px;}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand" onclick="goFeed()">israel<span class="g">.</span>doxbin<span class="g">.</span>com</div>
    <nav class="main-nav">
      <button class="nav-link" data-nav="feed" onclick="goFeed()">בית</button>
      <button class="nav-link" data-nav="new" onclick="goNew()">הוסף תיעוד</button>
      <button class="nav-link" data-nav="users" onclick="goUsers()">משתמשים</button>
      <button class="nav-link" data-nav="trending" onclick="goTrending()">מובילים</button>
      <button class="nav-link" data-nav="rules" onclick="goRules()">תקנון</button>
    </nav>
    <div class="nav-right">
      <span id="navAuth">
        <button onclick="openModal('login')">התחברות</button>
        <button onclick="openModal('signup')">הרשמה</button>
      </span>
      <span id="userBox" style="display:none;">
        <div class="user-nav" onclick="goProfile(user)">
          <span id="userNameNav"></span>
          <div class="ua" id="userAvatarNav"></div>
        </div>
        <button onclick="logout()">יציאה</button>
      </span>
    </div>
  </div>
</header>

<div id="main"><div class="empty">טוען...</div></div>

  <input type="text" id="lg-name" placeholder="שם משתמש">

  <button class="modal-btn" onclick="doSignup()">צור חשבון</button>

  <div class="modal-swap" onclick="closeModals()">סגור</div>

<footer>israel.doxbin.com © 2026</footer>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ujrnlgdqisadrxcwptzs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9xxKnIE7X85cBJ90JBvWLw_AGJ8hvvt';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let pastes = [];
let users = {};
let profileComments = {};
let user = localStorage.getItem('israel_user') || null;
let view = 'feed';
let viewId = null;
let page = 1;
const PER = 15;
let searchQ = '';
let searchScope = 'title';
let currentProfile = null;
let uploadedImage = null;

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}
function fmtNum(n){n=Number(n)||0;if(n>=1000000)return (n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+'K';return n.toString();}
function rankLabel(r){return {admin:'מנהל',council:'מועצה',elite:'עלית',rich:'עשיר',criminal:'פלילי',user:''}[r]||'';}
function authorHtml(p){const r=p.rank||'user';const l=rankLabel(r);return `<span class="rk rk-${r}">${esc(p.author)}${l?` <span class="rk-tag">[${l}]</span>`:''}</span>`;}
function timeAgo(ts){const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1)return 'עכשיו';if(m<60)return m+' דק׳';const h=Math.floor(m/60);if(h<24)return h+' שע׳';return Math.floor(h/24)+' ימים';}

async function loadData(){
  try{
    const { data: pastesData, error: e1 } = await sb.from('pastes').select('*').order('ts', {ascending:false});
    if(e1) throw e1;
    pastes = pastesData || [];

    const { data: usersData, error: e2 } = await sb.from('users').select('*');
    if(e2) throw e2;
    users = {};
    (usersData||[]).forEach(u => { users[u.name] = u; });

    const { data: pcmtData, error: e3 } = await sb.from('profile_comments').select('*').order('ts', {ascending:false});
    if(e3) throw e3;
    profileComments = {};
    (pcmtData||[]).forEach(c => {
      if(!profileComments[c.user_name]) profileComments[c.user_name] = [];
      profileComments[c.user_name].push(c);
    });

    render();
  }catch(err){
    console.error(err);
    document.getElementById('main').innerHTML = '<div class="empty">שגיאה בטעינת הנתונים: '+esc(err.message)+'</div>';
  }
}

function goFeed(){view='feed';page=1;render();scrollTop();}
function goNew(){view='new';render();scrollTop();}
function goTrending(){view='trending';render();scrollTop();}
function goUsers(){view='users';render();scrollTop();}
function goRules(){view='rules';render();scrollTop();}
function openPaste(id){view='view';viewId=id;render();scrollTop();}
function setPage(p){page=p;render();scrollTop();}
function goProfile(n){currentProfile=n;view='profile';render();scrollTop();}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}

function setActiveNav(){document.querySelectorAll('.nav-link').forEach(el=>{el.classList.toggle('active',el.dataset.nav===view);});}

function render(){
  const main = document.getElementById('main');
  if(view==='feed') main.innerHTML = renderFeed();
  else if(view==='new') main.innerHTML = renderEditor();
  else if(view==='trending') main.innerHTML = renderTrending();
  else if(view==='users') main.innerHTML = renderUsers();
  else if(view==='rules') main.innerHTML = renderRules();
  else if(view==='view') main.innerHTML = renderView();
  else if(view==='profile') main.innerHTML = renderProfile();
  updateAuth();
  setActiveNav();
  if(view==='new') setupDropzone();
}

function renderFeed(){
  const q = searchQ.trim().toLowerCase();
  let list = pastes.filter(p=>{
    if(!q) return true;
    const t=(p.title||'').toLowerCase(),c=(p.content||'').toLowerCase(),a=(p.author||'').toLowerCase();
    if(searchScope==='content') return t.includes(q)||c.includes(q)||a.includes(q);
    return t.includes(q)||a.includes(q);
  });
  list = [...list].sort((a,b)=>(b.ts||0)-(a.ts||0));
  const pinned = list.filter(p=>p.pin);
  const regular = list.filter(p=>!p.pin);
  const totalPages = Math.max(1, Math.ceil(regular.length/PER));
  if(page > totalPages) page = totalPages;
  const items = regular.slice((page-1)*PER, page*PER);

  const rowHtml = p => {
    const cls = p.pin ? 'pin-'+p.pin : '';
    return `<tr class="${cls}" onclick="openPaste('${p.id}')">
      <td class="title">${esc(p.title)}</td>
      <td class="c">${(p.comments||[]).length}</td>
      <td class="views">${fmtNum(p.views)}</td>
      <td class="author">${authorHtml(p)}</td>
      <td class="date">${esc(p.date)}</td>
    </tr>`;
  };

  const thead = `<thead><tr>
    <th>כותרת</th><th class="c">תגובות</th><th class="c">צפיות</th>
    <th class="e">מחבר</th><th class="e">תאריך</th>
  </tr></thead>`;

  const pinnedSec = pinned.length ? `
    <div class="section-head">מוצמדים <span class="count">(${pinned.length})</span></div>
    <table class="tbl">${thead}<tbody>${pinned.map(rowHtml).join('')}</tbody></table>
  ` : '';

  const regularSec = items.length ? `
    ${pinned.length?'<div class="section-head">תיעודים אחרונים</div>':''}
    <table class="tbl">${thead}<tbody>${items.map(rowHtml).join('')}</tbody></table>
  ` : `<div class="empty">אין תיעודים עדיין. היה הראשון לפרסם!</div>`;

  return `
    <div class="hero">
      ${LOGO_SVG}
      <div class="hero-links">
        <a href="https://discord.gg/guardians-of-israel" target="_blank" rel="noopener">דיסקורד — שומרי ישראל</a>
      </div>
      <div class="hero-label">חיפוש תיעוד</div>
      <div class="search-radio">
        <label><input type="radio" name="scope" value="title" ${searchScope==='title'?'checked':''} onchange="setScope('title')"> חיפוש בכותרת</label>
        <label><input type="radio" name="scope" value="content" ${searchScope==='content'?'checked':''} onchange="setScope('content')"> חיפוש בתוכן</label>
      </div>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="חיפוש..." value="${esc(searchQ)}" oninput="onSearch(this.value)">
        <button onclick="render()">חיפוש</button>
      </div>
      <div class="stats-line">מציג <b>${items.length}</b> מתוך <b>${regular.length}</b> תיעודים</div>
      ${renderPager(totalPages)}
    </div>
    <div class="container">${pinnedSec}${regularSec}</div>
  `;
}

function renderPager(total){
  if(total<=1) return '';
  const pages = [];
  if(total<=7){for(let i=1;i<=total;i++)pages.push(i);}
  else if(page<=4)pages.push(1,2,3,4,5,'…',total);
  else if(page>=total-3)pages.push(1,'…',total-4,total-3,total-2,total-1,total);
  else pages.push(1,'…',page-1,page,page+1,'…',total);
  return `<div class="pager">
    <button onclick="setPage(1)" ${page===1?'disabled':''}>«</button>
    ${pages.map(p=>p==='…'?'<button disabled>…</button>':`<button class="${p===page?'active':''}" onclick="setPage(${p})">${p}</button>`).join('')}
    <button onclick="setPage(${total})" ${page===total?'disabled':''}>»</button>
  </div>`;
}

let searchTimer;
function onSearch(v){
  searchQ = v;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    const input = document.getElementById('searchInput');
    const pos = input ? input.selectionStart : 0;
    render();
    const ni = document.getElementById('searchInput');
    if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); }
  }, 200);
}
function setScope(s){searchScope=s;render();}

async function toggleFollow(name){
  if(!user){toast('יש להתחבר כדי לעקוב');return;}
  if(!users[user]){await ensureUser(user);}
  const userObj = users[user];
  if(!userObj) return;
  const set = userObj.following_set || [];
  const idx = set.indexOf(name);
  let newSet;
  if(idx === -1){
    newSet = [...set, name];
    await sb.from('users').update({following_set:newSet, following:(userObj.following||0)+1}).eq('name',user);
    const target = users[name];
    if(target) await sb.from('users').update({followers:(target.followers||0)+1}).eq('name',name);
    toast('התחלת לעקוב אחרי '+name);
  } else {
    newSet = set.filter(n=>n!==name);
    await sb.from('users').update({following_set:newSet, following:Math.max(0,(userObj.following||0)-1)}).eq('name',user);
    const target = users[name];
    if(target) await sb.from('users').update({followers:Math.max(0,(target.followers||0)-1)}).eq('name',name);
    toast('הפסקת לעקוב אחרי '+name);
  }
  await loadData();
}

async function ensureUser(name){
  const { data } = await sb.from('users').select('*').eq('name', name).maybeSingle();
  if(!data){
    await sb.from('users').insert({name, rank:'user', joined:'ספטמבר 2026', following:0, followers:0, following_set:[]});
    const { data: d2 } = await sb.from('users').select('*').eq('name', name).maybeSingle();
    if(d2) users[name] = d2;
  } else {
    users[name] = data;
  }
}

function renderUsers(){
  const list = Object.values(users).map(u=>{
    const up = pastes.filter(p=>p.author===u.name);
    const views = up.reduce((s,p)=>s+(p.views||0),0);
    const cmts = up.reduce((s,p)=>s+((p.comments||[]).length),0);
    return {...u, count:up.length, views, cmts};
  }).sort((a,b)=>b.views-a.views);
  const rows = list.map((u,i)=>`
    <tr onclick="goProfile('${esc(u.name)}')">
      <td class="c" style="color:var(--gold);font-weight:600;font-family:'JetBrains Mono',monospace;">${i+1}</td>
      <td class="title">${authorHtml({author:u.name, rank:u.rank})}</td>
      <td class="c">${u.count}</td>
      <td class="views">${fmtNum(u.views)}</td>
      <td class="c">${u.cmts}</td>
      <td class="c">${u.followers||0}</td>
    </tr>`).join('');
  return `
    <div class="crumb"><a onclick="goFeed()">בית</a><span class="sep">/</span><span>משתמשים</span></div>
    <div class="container">
      <div class="section-head" style="margin-top:22px;">כל המשתמשים <span class="count">(${list.length})</span></div>

function onFileSelect(e){
  const f = e.target.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){toast('ניתן להעלות תמונות בלבד');return;}
  if(f.size > 5*1024*1024){toast('הקובץ גדול מדי');return;}
  const r = new FileReader();
  r.onload = ev=>{
    uploadedImage = {data:ev.target.result, name:f.name, size:f.size};
    document.getElementById('imgPreviewImg').src = ev.target.result;
    document.getElementById('imgPreviewName').textContent = f.name;
    document.getElementById('imgPreviewSize').textContent = (f.size/1024).toFixed(1)+' KB';
    document.getElementById('imgPreview').classList.add('show');
  };
  r.readAsDataURL(f);
}

function removeImage(){
  uploadedImage = null;
  const fi = document.getElementById('fileInput'); if(fi) fi.value = '';
  const pv = document.getElementById('imgPreview'); if(pv) pv.classList.remove('show');
}

function setupDropzone(){
  const dz = document.getElementById('dropzone');
  if(!dz || dz._setup) return;
  dz._setup = true;
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();}));
  dz.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if(!f) return;
    if(!f.type.startsWith('image/')){toast('ניתן להעלות תמונות בלבד');return;}
    if(f.size > 5*1024*1024){toast('הקובץ גדול מדי');return;}
    const r = new FileReader();
    r.onload = ev=>{
      uploadedImage = {data:ev.target.result, name:f.name, size:f.size};
      document.getElementById('imgPreviewImg').src = ev.target.result;
      document.getElementById('imgPreviewName').textContent = f.name;
      document.getElementById('imgPreviewSize').textContent = (f.size/1024).toFixed(1)+' KB';
      document.getElementById('imgPreview').classList.add('show');
    };
    r.readAsDataURL(f);
  });
}

async function submitPaste(){
  const content = document.getElementById('edContent').value.trim();
  const title = document.getElementById('edTitle').value.trim();
  const tagsRaw = document.getElementById('edTags').value.trim();
  const lang = document.getElementById('edLang').value;
  const anon = document.getElementById('edAnon').checked;
  const err = document.getElementById('edErr');

  if(!content && !uploadedImage){err.textContent = 'יש להזין תוכן או תמונה';return;}
  if(!title){err.textContent = 'כותרת היא שדה חובה';return;}
  err.textContent = 'מעלה...';

  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);
  const author = anon ? 'אנונימי' : (user || 'אורח');
  if(!anon && user) await ensureUser(user);

  const newPaste = {
    title, author,
    rank: anon ? 'user' : (users[author]?.rank || 'user'),
    content: content || '',
    image_data: uploadedImage?.data || null,
    image_name: uploadedImage?.name || null,
    tags, lang,
    views: 0,
    ts: Date.now(),
    date: new Date().toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}),
    comments: [],
    pin: null
  };

  const { data, error } = await sb.from('pastes').insert(newPaste).select().single();
  if(error){err.textContent = 'שגיאה: '+error.message;return;}

  uploadedImage = null;
  toast('התיעוד פורסם בהצלחה');
  pastes.unshift(data);
  openPaste(data.id);
}

function copyPaste(){
  const p = pastes.find(x=>x.id===viewId);
  if(!p) return;
  const text = p.content + (p.image_name ? '\n\n[תמונה: '+p.image_name+']' : '');
  navigator.clipboard.writeText(text).then(()=>{
    const b = document.getElementById('copyBtn');
    if(b){b.textContent='הועתק';setTimeout(()=>b.textContent='העתקת תוכן',1400);}
    toast('התוכן הועתק');
  }).catch(()=>toast('ההעתקה נכשלה'));
}

function sharePaste(){
  const url = 'https://israel.doxbin.com/#t-' + viewId;
  navigator.clipboard.writeText(url).then(()=>toast('הקישור הועתק')).catch(()=>toast(url));
}

async function deletePaste(id){
  if(!confirm('למחוק את התיעוד?')) return;
  await sb.from('pastes').delete().eq('id', id);
  pastes = pastes.filter(p=>p.id!==id);
  goFeed();
  toast('התיעוד נמחק');
}

async function addComment(id){
  const p = pastes.find(x=>x.id===id);
  if(!p) return;
  const inp = document.getElementById('cmtInput');
  const text = inp.value.trim();
  if(!text) return;
  p.comments = p.comments || [];
  p.comments.push({
    author: user || 'אורח', text,
    date: new Date().toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
  });
  await sb.from('pastes').update({comments: p.comments}).eq('id', id);
  render();
  toast('התגובה פורסמה');
}

function openModal(id){closeModals();document.getElementById('m-'+id).classList.add('open');}
function closeModals(){document.querySelectorAll('.modal-bg').forEach(m=>m.classList.remove('open'));}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});

async function doLogin(){
  const n = document.getElementById('lg-name').value.trim();
  const pw = document.getElementById('lg-pass').value.trim();
  const e = document.getElementById('lg-err');
  if(!n || !pw){e.textContent = 'נא למלא שם משתמש וסיסמה';return;}
  await ensureUser(n);
  setUser(n); closeModals(); toast('התחברת בהצלחה');
}

async function doSignup(){
  const n = document.getElementById('su-name').value.trim();
  const em = document.getElementById('su-email').value.trim();
  const pw = document.getElementById('su-pass').value.trim();
  const e = document.getElementById('su-err');
  if(!n || !pw){e.textContent = 'נא למלא שם משתמש וסיסמה';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){e.textContent = 'אימייל לא תקין';return;}
  await ensureUser(n);
  setUser(n); closeModals(); toast('נרשמת בהצלחה');
}

function setUser(n){
  user = n;
  localStorage.setItem('israel_user', n);
  updateAuth();
}

function logout(){
  user = null;
  localStorage.removeItem('israel_user');
  updateAuth(); toast('התנתקת');
}

function updateAuth(){
  const a = document.getElementById('navAuth');
  const b = document.getElementById('userBox');
  if(!a || !b) return;
  if(user){
    a.style.display = 'none';
    b.style.display = 'inline-flex';
    b.style.alignItems = 'center';
    document.getElementById('userNameNav').textContent = user;
    document.getElementById('userAvatarNav').textContent = user.charAt(0).toUpperCase();
  } else {
    a.style.display = 'inline';
    b.style.display = 'none';
  }
}

loadData();
setInterval(loadData, 30000);
</script>
